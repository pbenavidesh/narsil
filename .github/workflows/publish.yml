# The Stan stack (prophet, rstan, StanHeaders, ...) is excluded from renv.lock
# via renv/settings.json. Its PPM binaries fail on CI with a TBB symbol
# mismatch against RcppParallel.
# prophet entered this project through modeltime (a hard Imports dependency),
# which was loaded but never used and has been removed from intro.qmd.
# Safe only while every Prophet-using document has a committed _freeze/.
# To re-execute docs/modules/module_3/04_prophet/, install these locally first.

on:
  workflow_dispatch:
    inputs:
      refresh_fred:
        description: 'Refresh FRED documents (fred-data: true)?'
        type: boolean
        default: false
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true
      
      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'

      - name: Install R Dependencies
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 5

      - name: Invalidate FRED freeze if requested
        if: ${{ github.event.inputs.refresh_fred == 'true' }}
        run: Rscript scripts/invalidate_fred.R

      # Render and publish are deliberately separate so the asset check can run
      # in between. Publishing first and failing afterwards would leave a broken
      # site up with a red badge -- the worst of both.
      - name: Render site
        run: quarto render

      # Guards against assets that 404 on the published site while the page
      # itself renders fine. That is how the plotly widgets stayed broken for
      # about a year: the divs were present, only the JavaScript was missing.
      - name: Check local asset links
        run: python3 scripts/check_site_links.py _site

      - name: Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated _freeze
        if: ${{ github.event.inputs.refresh_fred == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _freeze/
          git commit -m "chore: update _freeze for FRED documents [skip ci]" || echo "Nothing to commit"
          git push