# fable.prophet and prophet are excluded from renv.lock (see renv/settings.json).
# Their Stan dependencies fail to install on CI due to a TBB binary mismatch.
# This is safe only while every Prophet-using document has a committed _freeze/.
# If you ever need to force re-execution of docs/modules/module_3/04_prophet/,
# you must restore these packages first.
#
# The same applies to the refresh_fred input below: module_4/02_bootstrap_combinations
# and module_4/03_cv are marked `fred-data: true` AND load fable.prophet, so a
# refresh_fred run deletes their freeze and will fail at library(fable.prophet)
# unless the packages are restored for that run.
#
# rstan, rstantools, inline, loo, posterior and QuickJSR are ignored too -- they
# entered only via prophet. StanHeaders, BH and RcppParallel are NOT ignored:
# modeltime needs StanHeaders, and anytime (via timetk/tsibble) needs BH.

on:
  workflow_dispatch:
    inputs:
      refresh_fred:
        description: 'Refresh FRED documents (fred-data: true)?'
        type: boolean
        default: false
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true
      
      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'

      - name: Install R Dependencies
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 5

      - name: Invalidate FRED freeze if requested
        if: ${{ github.event.inputs.refresh_fred == 'true' }}
        run: Rscript scripts/invalidate_fred.R

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated _freeze
        if: ${{ github.event.inputs.refresh_fred == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _freeze/
          git commit -m "chore: update _freeze for FRED documents [skip ci]" || echo "Nothing to commit"
          git push