on:
  workflow_dispatch:
    inputs:
      refresh_fred:
        description: 'Refresh FRED documents (fred-data: true)?'
        type: boolean
        default: false
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true
      
      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'

      - name: Install R Dependencies
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 4

      - name: Invalidate FRED freeze if requested
        if: ${{ github.event.inputs.refresh_fred == 'true' }}
        run: Rscript scripts/invalidate_fred.R

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated _freeze
        if: ${{ github.event.inputs.refresh_fred == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _freeze/
          git commit -m "chore: update _freeze for FRED documents [skip ci]" || echo "Nothing to commit"
          git push